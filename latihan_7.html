<!DOCTYPE html>
<html>
<head>
    <title>Form Demo 10</title>
</head>

<body>

    <h1 align="center">Contact Details</h1>

    <form>
        <fieldset style="width: 680px; margin: auto;">

            <h3>Please enter your personal details:</h3>

            <table align="center" cellpadding="8">

                <tr>
                    <td>First name: *</td>
                    <td>
                        <input type="text" value="Fred" size="18" required>
                    </td>
                </tr>

                <tr>
                    <td>Last name: *</td>
                    <td>
                        <input type="text" value="Bloggs" size="18" required>
                    </td>
                </tr>

                <tr>
                    <td>Street address:</td>
                    <td>
                        <input type="text" value="Station Road" size="40">
                    </td>
                </tr>

                <tr>
                    <td>Town/city:</td>
                    <td>
                        <input type="text" value="Dorking" size="18">
                    </td>
                </tr>

                <tr>
                    <td>Postcode/zip:</td>
                    <td>
                        <input type="text" value="DW1 5GA" size="10">
                    </td>
                </tr>

                <tr>
                    <td>Telephone:</td>
                    <td>
                        <input type="tel" value="0123 456789" size="18">
                    </td>
                </tr>

                <tr>
                    <td>Mobile:</td>
                    <td>
                        <input type="tel" value="01567 898976" size="18">
                    </td>
                </tr>

                <tr>
                    <td>Email address: *</td>
                    <td>
                        <input type="email"
                               value="fbloggs@coldmail.net"
                               size="40" required>
                    </td>
                </tr>

            </table>

            <br>

            <p align="center">
                Fields marked * are required.
            </p>

            <p align="center">
                <input type="submit" value="Submit">
            </p>

        </fieldset>
    </form>

</body>
</html>
