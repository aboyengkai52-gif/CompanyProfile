<!DOCTYPE html>
<html>
<head>
    <title>Contact Details</title>
</head>

<body>

    <h1 align="center">Contact Details</h1>

    <form>
        <fieldset>

            <legend>Please enter your personal details:</legend>

            <br>

            <label>First name: *</label>
            <input type="text" name="firstname" value="Fred">
            <br><br>

            <label>Last name: *</label>
            <input type="text" name="lastname" value="Bloggs">
            <br><br>

            <label>Street address:</label>
            <input type="text" name="address"
                   value="Station Road" size="40">
            <br><br>

            <label>Town/city:</label>
            <input type="text" name="city" value="Dorking">
            <br><br>

            <label>Postcode/zip:</label>
            <input type="text" name="postcode" value="DW1 5GA">
            <br><br>

            <label>Telephone:</label>
            <input type="tel" name="telephone"
                   value="0123 456789">
            <br><br>

            <label>Mobile:</label>
            <input type="tel" name="mobile"
                   value="01567 898976">
            <br><br>

            <label>Email address: *</label>
            <input type="email" name="email"
                   value="fbloggs@coldmail.net" size="40">
            <br><br>

            <p align="center">
                Fields marked * are required.
            </p>

            <center>
                <input type="submit" value="Submit">
            </center>

        </fieldset>
    </form>

</body>
</html>
